<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Task Manager ✨</h1>
    <p>Управление задачами проекта</p>
    <nav class="site-nav" aria-label="Основная навигация">
        <a href="index.html" aria-current="page">Доска задач</a>
        <a href="projects.html">Проекты</a>
        <a href="/team">Сотрудники</a>
        <a href="/events">События</a>
        <a href="/profile">Профиль</a>
        <a href="/login">Вход</a>
    </nav>
</header>

<main>
    <section class="board-project" aria-label="Текущий проект">
        <div><span>Текущий проект</span><p id="projectInfo">Загружаем проект…</p></div>
        <a href="projects.html">Выбрать или настроить проект →</a>
    </section>
    <section class="task-form">
        <input
            type="text"
            id="taskInput"
            aria-label="Исходные требования задачи"
            maxlength="500"
            placeholder="Например: Сделать форму логина"
        >
        <select id="taskTypeSelect" aria-label="Тип задачи">
            <option value="feature">Новая функция</option><option value="fix">Исправление</option>
            <option value="tests">Тесты</option><option value="docs">Документация</option>
        </select>
        <label class="manual-toggle"><input id="skipAi" type="checkbox"> Без ИИ</label>
        <select id="assigneeSelect" aria-label="Исполнитель задачи"><option value="">Не назначен</option></select>
        <button id="addTaskButton" disabled>Подготовить карточку</button>
    </section>
    <p id="connectionStatus" role="status">Подключаемся к серверу…</p>
    <p id="feedback" role="status" aria-live="polite"></p>
    <label for="taskSearch">Поиск по задачам</label>
    <input id="taskSearch" type="search" placeholder="Название, описание или ветка">
    <button id="refreshButton" type="button">Обновить доску</button>

    <section class="board">
        <div class="column">
            <h2>To Do</h2>
            <div class="task-list" id="todo"></div>
        </div>

        <div class="column">
            <h2>In Progress</h2>
            <div class="task-list" id="progress"></div>
        </div>

        <div class="column">
            <h2>Review</h2>
            <div class="task-list" id="review"></div>
        </div>
    </section>
</main>

<dialog id="taskDialog" aria-labelledby="taskDialogTitle">
    <div class="task-dialog-header">
        <h2 id="taskDialogTitle"></h2>
        <button id="closeTaskDialog" type="button" aria-label="Закрыть задачу" autofocus>Закрыть ×</button>
    </div>
    <div id="taskDialogContent"></div>
</dialog>
<script src="script.js"></script>
</body>
</html>
